<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects - pyiconlaser</title>
    <meta name="description" content="pyiconlaser Python library">

    <script>
        const savedTheme = localStorage.getItem("theme");

        const theme =
            savedTheme === "light" || savedTheme === "dark"
                ? savedTheme
                : window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light";

        document.documentElement.setAttribute(
            "data-theme",
            theme
        );
    </script>

    <link rel="stylesheet" href="/assets/css/style.css?v=20260819">
    <script src="/assets/js/projects.js" defer></script>
    <script src="/assets/js/components.js" defer></script>
</head>

<body>
    <!-- HEADER -->

    <main>
        <section>
            <div id="about-project" data-project="pyiconlaser"></div>
        </section>

        <section>
            <h1>Devlogs</h1>
            <div id="devlog" data-project="pyiconlaser"></div>
        </section>
    </main>

    <!-- FOOTER -->
</body>
</html>
