<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Field Notes</title>

    <script>
        const savedTheme = localStorage.getItem("theme");

        const theme =
            savedTheme === "light" || savedTheme === "dark"
                ? savedTheme
                : window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light";

        document.documentElement.setAttribute(
            "data-theme",
            theme
        );
    </script>

    <link rel="stylesheet" href="/assets/css/style.css?v=20260819">
    <script src="/assets/js/components.js" defer></script>
</head>

<body>
    <!-- HEADER -->

    <main>
        <section>
            <h1>Field Notes</h1>
            <p>Notes, experiments, mistakes, and random thoughts that don't fit anywhere else.</p>
        </section>

        <section>
            <div id="field-notes"></div>
        </section>
    </main>

    <!-- FOOTER -->
</body>
</html>
